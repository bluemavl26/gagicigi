<style>
/* Layout: 흰 캔버스 한 장 — 위 얇은 경로바, 가운데 가지 캔버스(가지가 곧 메뉴), 아래 상태 한 줄 + 입력 */
:root{
  --bg:#F7F5F0; --paper:#FBFAF6; --line-ink:#24221F; --leaf-fill:#D6EDC0; --dot:#4FA334; --dot-fill:#E2F2D4; --sprout-body:#CFE6C6; --bubble:#FFFFFF; --ink:#2B2A27; --muted:#9A9890; --faint:#C9C7C0; --line:rgba(43,42,39,.08);
  --chrome:#EEEBE4; --bark:#3E3226; --bark2:#6E5B45; --accent:#2F7A3E; --fruit:#F07A3E; --warn:#C98A00;
  --f:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1A18;--paper:#22211E;--line-ink:#E8E4DA;--sc-filter:invert(.9) hue-rotate(180deg);--leaf-fill:#4F6B3E;--dot:#8FD06A;--dot-fill:#2C3B25;--sprout-body:#4C6345;--bubble:#2E2D29;--ink:#ECEBE6;--muted:#8D8B84;--faint:#4A4944;--line:rgba(236,235,230,.08);
  --chrome:#1F1F1D;--bark:#CDBFA8;--bark2:#9C8C74;--accent:#7FCB8C;--fruit:#F29A66;--warn:#E9BC63;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1A18;--paper:#22211E;--line-ink:#E8E4DA;--sc-filter:invert(.9) hue-rotate(180deg);--leaf-fill:#4F6B3E;--dot:#8FD06A;--dot-fill:#2C3B25;--sprout-body:#4C6345;--bubble:#2E2D29;--ink:#ECEBE6;--muted:#8D8B84;--faint:#4A4944;--line:rgba(236,235,230,.08);
  --chrome:#1F1F1D;--bark:#CDBFA8;--bark2:#9C8C74;--accent:#7FCB8C;--fruit:#F29A66;--warn:#E9BC63;color-scheme:dark}
html,body{height:100%}
body{margin:0;background-color:var(--bg);background-image:var(--grain,none);color:var(--ink);font-family:var(--f);font-size:15px;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
/* 경로바 */
.bar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;height:68px;padding:0 16px;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:18px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.crumb img{width:54px;height:56px;object-fit:contain;filter:var(--sc-filter,none);transform:rotate(-12deg)}
.treerow{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 8px 0 10px}
.treerow .bar-r{margin-left:auto;flex:0 0 auto}
.treerow .tree-btn{min-width:0}
.crumb .sep{color:var(--faint)}
.crumb span{white-space:nowrap}
.crumb img.wordmark{width:auto;height:40px;transform:none;filter:none;margin-top:2px}

.tree-btn{display:inline-flex;align-items:center;gap:6px;min-width:0;padding:6px 8px;border-radius:8px;color:var(--ink);font-weight:500;font-size:16px}
.tree-btn:hover{background:var(--chrome)}
.tree-btn .tleaf{width:20px;height:20px;flex:0 0 auto}
.tree-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78vw}
.tree-btn svg{width:12px;height:12px;color:var(--muted);flex:0 0 auto}
.bar-r{margin-left:auto;display:flex;gap:2px}
.ib{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--chrome);color:var(--ink)}
.ib svg{width:26px;height:26px}
.ib[aria-pressed="false"] .on,.ib[aria-pressed="true"] .off{display:none}

/* 캔버스 */
.stage{position:relative;flex:1 1 0;min-height:380px;max-height:760px;overflow:hidden;touch-action:manipulation}
.stage #labels{position:relative;z-index:2}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lbl{position:absolute;display:flex;align-items:center;gap:7px;font-size:19px;line-height:1.22;color:var(--muted);white-space:normal;word-break:keep-all;overflow-wrap:anywhere;text-align:left;padding:4px 6px;border-radius:6px;transform:translate(0,-50%);transition:color .15s,background .15s}
.lbl:hover,.lbl.sel{color:var(--ink);background:var(--chrome)}
.lbl .dot{width:14px;height:14px;border:2.4px solid var(--dot);background:var(--dot-fill);border-radius:50%;flex:0 0 auto}
.lg{position:absolute;display:flex;flex-direction:column;align-items:flex-start;transform:translate(0,-17px)}
.lg.l{align-items:flex-end;transform:translate(-100%,-17px)}
.lg.c{align-items:center;transform:translate(-50%,-17px)}
.lg.stemg{transform:translate(0,-50%);max-width:calc(50% - 40px)}
.lg .lbl{position:static;transform:none;max-width:100%}
.lg.l .lbl{flex-direction:row-reverse;text-align:right}
.lg .lbl.twig{margin-top:-2px;padding-top:2px;padding-bottom:2px}
.lg:not(.l) .lbl.twig{padding-left:13px}.lg.l .lbl.twig{padding-right:13px}
.lbl .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbl.l{transform:translate(-100%,-50%);flex-direction:row-reverse;text-align:right}
.lbl .dot{align-self:center}
.lbl.c{transform:translate(-50%,-50%)}
.lbl.twig{font-size:16.5px}
.lbl.twig .dot{width:11px;height:11px;border-width:2px}
.lbl.stem{text-align:left;white-space:normal;word-break:keep-all;max-width:100%;line-height:1.2;color:var(--ink);font-weight:700;font-size:21px;letter-spacing:-.02em}
.lbl.stem .smile{width:30px;height:38px;flex:0 0 auto;margin-top:-6px}

.empty{flex-direction:column}
.empty .smile{width:84px;height:105px;flex:0 0 auto}
.buddy{position:absolute;bottom:0;z-index:0;pointer-events:none;transition:width .6s cubic-bezier(.3,1.5,.5,1),left .6s cubic-bezier(.3,1.5,.5,1)}
.buddy .smile{display:block;width:100%;height:auto}
.buddy.hop{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-14px) scale(1.04,.96)}60%{transform:translateY(0) scale(1.06,.94)}80%{transform:scale(.98,1.02)}}
.smile *{vector-effect:non-scaling-stroke}
.smile .fs,.smile .cry,.smile .legs,.smile .arms-sit{display:none}
.buddy.crying .cry,.buddy.crying .legs,.buddy.crying .arms-sit{display:inline}
.buddy.crying .fn,.buddy.crying .feet,.buddy.crying .arm-l,.buddy.crying .arm-r{display:none}
.buddy.crying .torso{transform:translateY(2.6px)}
.buddy.crying .dance{animation:sob .5s ease-in-out infinite}
.buddy.crying .lv{animation:droop 2.6s ease-in-out infinite}
.buddy.crying .tear{transform-box:fill-box;transform-origin:50% 0;animation:tear 1.1s ease-in infinite}
.buddy.crying .t2{animation-delay:.5s}
@keyframes sob{0%,100%{transform:translateY(0)}50%{transform:translateY(.7px)}}
@keyframes droop{0%,100%{transform:rotate(-3deg) scaleY(.9)}50%{transform:rotate(3deg) scaleY(.9)}}
@keyframes tear{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:1}100%{transform:translateY(5px) scale(1);opacity:0}}
.buddy.shock .cry,.buddy.shock .legs,.buddy.shock .arms-sit{display:none!important}.buddy.shock .fs{display:inline!important}.buddy.shock .feet,.buddy.shock .arm-l,.buddy.shock .arm-r{display:inline!important}.buddy.shock .torso{transform:none!important}
.smile .lv{transform-box:view-box;transform-origin:16px 13px;animation:sp-sway 1.8s ease-in-out infinite}
.smile .se{transform-box:view-box;transform-origin:16px 22.6px;animation:sp-blink 3.8s infinite}
.smile .dance{transform-box:view-box;transform-origin:16px 38px;animation:sp-dance 1.8s ease-in-out infinite}
.smile .bd{animation:sp-bob .9s ease-in-out infinite}
.smile .arm-l{transform-box:view-box;transform-origin:9.4px 20.5px;animation:arm-l .9s ease-in-out infinite alternate}
.smile .arm-r{transform-box:view-box;transform-origin:22.6px 20.5px;animation:arm-r .9s .45s ease-in-out infinite alternate}
@keyframes sp-sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes sp-blink{0%,88%,94%,100%{transform:scaleY(1)}91%{transform:scaleY(.1)}}
@keyframes sp-dance{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes sp-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9px)}}
@keyframes arm-l{0%{transform:rotate(8deg)}100%{transform:rotate(-38deg)}}
@keyframes arm-r{0%{transform:rotate(-8deg)}100%{transform:rotate(38deg)}}
.buddy.shock .fn{display:none}.buddy.shock .fs{display:inline}
.buddy.shock .dance,.buddy.shock .bd,.buddy.shock .lv{animation:none}
.buddy.shock .arm-l{animation:none;transform:rotate(-70deg)}.buddy.shock .arm-r{animation:none;transform:rotate(70deg)}
.buddy.shock{animation:jump .5s ease}
@keyframes jump{0%,100%{transform:none}35%{transform:translateY(-16px) scale(.96,1.05)}70%{transform:translateY(0) scale(1.05,.95)}}
@media (prefers-reduced-motion: reduce){.smile *{animation:none!important}}
.empty{position:absolute;left:0;right:0;top:46%;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:19px;font-weight:500;color:var(--muted);padding:0 24px;pointer-events:none}

/* 작은 액션 */
.pop{position:absolute;z-index:5;width:max-content;max-width:calc(100% - 16px);display:flex;gap:2px;padding:3px;background:var(--paper);border-radius:10px;box-shadow:0 0 0 1px var(--line),0 8px 24px -10px rgba(0,0,0,.25);transform:translateX(-50%)}
.pop button{height:42px;padding:0 13px;border-radius:8px;font-size:17px;font-weight:500;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pop button:hover{background:var(--chrome)}
.pop .ok{color:var(--accent)}
.pop .armed{background:var(--ink);color:var(--paper)}
.pop svg{width:18px;height:18px}
.pop-title{position:absolute;z-index:5;width:max-content;max-width:min(calc(100% - 16px),440px);font-size:16px;color:var(--ink);background:var(--chrome);padding:4px 8px;border-radius:6px;transform:translateX(-50%);white-space:normal;word-break:keep-all;text-align:center}
.edit{position:absolute;z-index:6;transform:translate(-50%,-50%);font:inherit;font-size:18px;padding:5px 8px;border-radius:7px;border:0;box-shadow:0 0 0 1.5px var(--accent);background:var(--paper);color:var(--ink);width:min(70%,280px)}

/* 아래 */
.foot{flex:0 0 auto;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px))}
.status{display:flex;justify-content:center;align-items:center;gap:6px;font-size:15.5px;color:var(--muted);min-height:36px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.status b{font-weight:600;color:var(--ink)}
.status .w{color:var(--warn)}
.status button{color:var(--warn);text-decoration:underline;text-underline-offset:2px;font-size:15.5px}
.chip{display:flex;align-items:center;gap:6px;font-size:16px;color:var(--muted);margin:2px 2px 6px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{font-size:15px;color:var(--ink);background:var(--chrome);border-radius:999px;padding:3px 9px;flex:0 0 auto}
.kinds{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.kind{display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 8px;border-radius:999px;font-size:12px;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.kind i{width:8px;height:8px;border-radius:2px}
.kind[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:600}
.row{display:flex;gap:8px}
.inp{flex:1;min-width:0;height:56px;border-radius:14px;border:0;background:var(--chrome);color:var(--ink);font:inherit;font-size:19px;padding:0 14px}
.inp:focus{outline:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp::placeholder{color:var(--muted)}
.inp.nudge{animation:nudge .35s;box-shadow:inset 0 0 0 1.5px var(--warn)}
@keyframes nudge{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.go{flex:0 0 auto;height:56px;min-width:80px;padding:0 18px;border-radius:14px;font-size:19px;background:var(--ink);color:var(--paper);font-weight:600}
.go:active{transform:scale(.97)}

/* 토스트 */
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;font-size:17px;width:max-content;max-width:calc(100% - 32px)}
.toast button{background:var(--paper);color:var(--ink);border-radius:999px;height:36px;padding:0 14px;font-weight:600;font-size:15px;white-space:nowrap}

/* 시트 */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.25);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh-head h2{margin:0;font-size:21px;font-weight:700}
.sh-head button{font-size:17px;color:var(--muted)}
.tlist{list-style:none;margin:0 0 10px;padding:0}
.tlist button{width:100%;display:flex;align-items:center;gap:10px;padding:14px 6px;font-size:18px;border-radius:8px;text-align:left}
.tlist button:hover{background:var(--chrome)}
.tlist i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.tlist span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist small{color:var(--muted);font-size:15px}
.tlist .cur span{font-weight:700}
.newt{width:100%;font-size:18px;padding:14px 6px;border-radius:8px;text-align:left;color:var(--accent);font-weight:600}
.newt:hover{background:var(--chrome)}
.forest-line{font-size:19px;font-weight:500;margin:2px 0 12px}
.forest{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.forest button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:10px}
.forest button:hover{background:var(--chrome)}
.forest canvas{width:96px;height:64px}
.forest span{font-size:14.5px;color:var(--muted);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.forest .growing canvas{opacity:.45}
.files{display:flex;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.files button{font-size:15px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.snipper{position:absolute;z-index:4;pointer-events:none;width:102px;height:111px;margin:-12px 0 0 -51px;transform-origin:51px 12px;transform:rotate(var(--r));animation:sc-life 1.4s ease forwards}
.snipper .sc{position:absolute;inset:0;transform-origin:51px 12px;animation:sc-in .34s cubic-bezier(.3,1.7,.5,1) both}
.snipper .jig{position:absolute;inset:0;transform-origin:51px 70px;animation:sc-jig .7s .18s ease-in-out both}
.snipper img{position:absolute;left:0;top:0;width:102px;height:auto;filter:var(--sc-filter,none)}
.snipper .bl{transform-origin:43.6px 33px;animation:sc-l .62s .18s ease-in-out both}
.snipper .br{transform-origin:58px 33px;animation:sc-r .62s .18s ease-in-out both}
.snipper .eyes{position:absolute;left:0;top:0;width:102px;height:111px;overflow:visible}
.snipper .spring{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:sp-str .95s .32s both}
.snipper .ball{animation:boing .95s .32s both}
.snipper .e2 .ball{animation-name:boing2}
.snipper .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink .5s .02s both}
.snipper .pupil{animation:roll .95s .32s both}
@keyframes sc-in{0%{transform:translateY(34px) scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes sc-l{0%{transform:rotate(-4deg)}30%{transform:rotate(17deg)}50%{transform:rotate(-3deg)}80%,100%{transform:rotate(17deg)}}
@keyframes sc-r{0%{transform:rotate(4deg)}30%{transform:rotate(-17deg)}50%{transform:rotate(3deg)}80%,100%{transform:rotate(-17deg)}}
@keyframes sc-jig{0%,100%{transform:none}30%{transform:scale(1.06,.92)}45%{transform:scale(.97,1.04)}80%{transform:scale(1.06,.92)}92%{transform:scale(.98,1.02)}}
@keyframes boing{0%{transform:none}14%{transform:translate(-3px,-15px) scale(1.35)}28%{transform:translate(-1px,-7px) scale(1.15)}42%{transform:translate(-3px,-13px) scale(1.3)}56%{transform:translate(-2px,-9px) scale(1.2)}70%{transform:translate(-2px,-11px) scale(1.25)}100%{transform:none}}
@keyframes boing2{0%{transform:none}14%{transform:translate(3px,-17px) scale(1.35)}28%{transform:translate(1px,-6px) scale(1.15)}42%{transform:translate(3px,-14px) scale(1.3)}56%{transform:translate(2px,-8px) scale(1.2)}70%{transform:translate(2px,-11px) scale(1.25)}100%{transform:none}}
@keyframes sp-str{0%,100%{transform:scaleY(0)}14%{transform:scaleY(2.2)}28%{transform:scaleY(1)}42%{transform:scaleY(1.9)}56%{transform:scaleY(1.3)}70%{transform:scaleY(1.6)}90%{transform:scaleY(.3)}}
@keyframes blink{0%,100%{transform:scaleY(0)}40%{transform:scaleY(1)}}
@keyframes roll{0%{transform:none}14%{transform:translate(-1.2px,-1px)}30%{transform:translate(1.2px,-1px)}46%{transform:translate(1.2px,1.2px)}62%{transform:translate(-1.2px,1.2px)}100%{transform:none}}
@keyframes sc-life{0%,78%{opacity:1;translate:0 0}100%{opacity:0;translate:0 -16px}}
.snip-say{position:absolute;z-index:4;pointer-events:none;font-weight:800;font-size:22px;color:var(--line-ink);letter-spacing:-.02em;transform:translate(-50%,-50%) rotate(-8deg);animation:say 1s .36s both}
@keyframes say{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1.15)}40%{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) rotate(-8deg)}}
@media (prefers-reduced-motion: reduce){.snipper,.snip-say{display:none}}
.nudge{position:relative;z-index:7;margin:6px 0 4px;display:flex;align-items:center;gap:10px;padding:8px 6px 8px 10px;background:var(--paper);border-radius:16px;box-shadow:0 0 0 1.5px var(--line-ink),0 10px 26px -12px rgba(0,0,0,.35);animation:nudge-in .5s cubic-bezier(.3,1.5,.5,1) both}
.nudge-ic{width:28px;height:30px;object-fit:contain;flex:0 0 auto;filter:var(--sc-filter,none);animation:nudge-wig 2.4s 1s ease-in-out infinite}
.nudge-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nudge-t b{font-size:15.5px;font-weight:700}
.nudge-t small{font-size:13px;line-height:1.35;color:var(--muted);word-break:keep-all}
.nudge-go{flex:0 0 auto;height:38px;padding:0 14px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;font-size:15px}
.nudge-x{flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.nudge-x svg{width:16px;height:16px}
.nudge.out{animation:nudge-out .25s ease forwards}
@keyframes nudge-in{0%{opacity:0;transform:translateY(16px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes nudge-out{to{opacity:0;transform:translateY(12px)}}
@keyframes nudge-wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(10deg)}95%{transform:rotate(-6deg)}}
.buddy{cursor:pointer;padding:0;background:none;border:0}
.bubble{position:absolute;z-index:3;max-width:min(62%,230px);padding:11px 18px;background:var(--bubble);color:var(--ink);font-size:15.5px;font-weight:600;line-height:1.35;letter-spacing:-.02em;word-break:keep-all;border-radius:24px;pointer-events:none;transform-origin:0 100%;animation:bub-in .45s cubic-bezier(.3,1.6,.5,1) both,bub-float 3s .5s ease-in-out infinite}
.bubble::before,.bubble::after{content:"";position:absolute;border-radius:50%;background:var(--bubble)}
.bubble::before{left:-14px;bottom:10px;width:12px;height:12px}
.bubble::after{left:-25px;bottom:4px;width:7px;height:7px}
.bubble.out{animation:bub-out .25s ease forwards}
@keyframes bub-in{0%{opacity:0;transform:scale(.3) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes bub-out{to{opacity:0;transform:scale(.6)}}
@keyframes bub-float{0%,100%{translate:0 0}50%{translate:0 -3px}}
@media (max-width:480px){.lbl{font-size:16.5px}.lbl.twig{font-size:14.5px}.lbl.stem{font-size:18.5px}.bubble{font-size:14.5px;padding:9px 14px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s);
const LS='gajichigi.v1', LSP='gajichigi.pref';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}h^=h>>>16;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;return (h>>>0)/4294967296};
const rng=seed=>{let a=Math.floor(hash(seed)*4294967296)>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const MAX_OK=4, SHOW=10;

/* 나무 종류 = 이끼 색 */
/* 나무는 한 종류: 연두 이끼 */
const MOSS=['#8CCB5E','#B5DE8C','#5E9F3C'];
const SPECIES=[{name:'나무',moss:MOSS}];
const sp=()=>SPECIES[0];

/* ---------- 상태 ---------- */
let pref={sound:true}; try{Object.assign(pref,JSON.parse(localStorage.getItem(LSP)||'{}'))}catch(e){}
const emptyState=()=>({trees:[],branches:[],activeId:null,updatedAt:0});
function sampleState(){const t=Date.now(),a='sample-a',b='sample-b';return{sample:true,updatedAt:0,activeId:a,
  trees:[{id:a,kind:0,title:'포트폴리오 오픈',createdAt:t-86400e3,doneAt:null},{id:b,kind:0,title:'은행 업무',createdAt:t-3600e3,doneAt:null}],
  branches:[
    {id:'s1',treeId:a,parentId:null,text:'썸네일 고르기',state:'open',createdAt:t-5e6},
    {id:'s2',treeId:a,parentId:'s1',text:'색감 맞추기',state:'open',createdAt:t-4e6},
    {id:'s3',treeId:a,parentId:null,text:'도메인 연결',state:'open',createdAt:t-3e6},
    {id:'s4',treeId:a,parentId:null,text:'폰트 고민',state:'open',createdAt:t-2e6},
    {id:'s5',treeId:a,parentId:null,text:'자기소개 다듬기',state:'open',createdAt:t-1e6},
    {id:'s6',treeId:a,parentId:null,text:'작업 파일 정리',state:'solved',createdAt:t-9e6,closedAt:t-6e6},
    {id:'s8',treeId:b,parentId:null,text:'통장 사본',state:'open',createdAt:t-3e6},
    {id:'s9',treeId:b,parentId:null,text:'자동이체 변경',state:'open',createdAt:t-2e6},
  ]}}
function migrate(x){if(!x||!x.trees)return emptyState();x.trees.forEach((t,i)=>{if(typeof t.kind!=='number')t.kind=i%SPECIES.length});
  const a=x.trees.filter(t=>!t.doneAt);if(!a.some(t=>t.id===x.activeId))x.activeId=a.length?a[a.length-1].id:null;return x}
let S=emptyState();
try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r&&r.trees)S=migrate(r)}catch(e){}
if(!S.trees.length&&!S.branches.length)S=sampleState();

let sel=null, editing=null, target=null, planting=false, pickKind=0, armed=false, undoSnap=null, toastT=null;
const actives=()=>S.trees.filter(t=>!t.doneAt).sort((a,b)=>a.createdAt-b.createdAt);
const cur=()=>{const a=actives();return a.find(t=>t.id===S.activeId)||a[a.length-1]};
const ofTree=id=>S.branches.filter(b=>b.treeId===id);
const openOf=id=>ofTree(id).filter(b=>b.state==='open');

/* ---------- 저장 ---------- */
let docRef=null,cloud=false,saveT=null,writing=false,dirty=false;
const local=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
function save(){if(S.sample)return;S.updatedAt=Date.now();local();if(docRef){clearTimeout(saveT);saveT=setTimeout(flush,500)}}
async function flush(){if(!docRef)return;if(writing){dirty=true;return}writing=true;
  try{await docRef.set(JSON.parse(JSON.stringify(S)))}catch(e){try{await new Promise(r=>setTimeout(r,800));await docRef.set(JSON.parse(JSON.stringify(S)))}catch(e2){}}
  writing=false;if(dirty){dirty=false;flush()}}
async function initCloud(){
  if(!window.claude||!window.claude.use)return;
  try{const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;
    const id=await user.id();if(!id)return;docRef=db.doc('data/users/'+id+'/garden');let first=true;
    docRef.onSnapshot(snap=>{const r=snap.exists?snap.data():null;
      if(first){first=false;cloud=true;

function snipper(x,y,ang){
  let nx=-Math.sin(ang),ny=Math.cos(ang);if(ny>0){nx=-nx;ny=-ny}           /* 날이 위쪽을 향하게 */
  const deg=Math.atan2(ny,nx)*180/Math.PI+90;
  const el=document.createElement('div');el.className='snipper';el.style.left=x+'px';el.style.top=y+'px';el.style.setProperty('--r',deg+'deg');
  el.innerHTML=`<div class="sc">${SCISSORS}</div>`;stage.appendChild(el);
  const say=document.createElement('span');say.className='snip-say';say.textContent='싹둑!';
  say.style.left=Math.max(34,Math.min(W-34,x+(x<W/2?-48:48)))+'px';say.style.top=Math.max(20,y-34)+'px';stage.appendChild(say);

});
stage.addEventListener('keydown',e=>{if(e.target.id!=='editIn')return;if(e.key==='Enter'){e.preventDefault();e.target.blur()}if(e.key==='Escape'){editing=null;render()}});
stage.addEventListener('focusout',e=>{if(e.target.id!=='editIn'||!editing)return;const v=e.target.value.trim(),id=editing;editing=null;sel=null;
  if(v){if(id==='stem'){const t=cur();if(t&&v!==t.title){snap();t.title=v;save()}}else{const b=S.branches.find(q=>q.id===id);if(b&&v!==b.text){snap();b.text=v;save()}}}render()});
$('#chipX').addEventListener('click',()=>{target=null;planting=false;render()});
$('#kinds').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(!b)return;pickKind=+b.dataset.kind;if(S.sample){S=emptyState();planting=true}render();$('#inp').focus()});
$('#treeBtn').addEventListener('click',treesSheet);
$('#forestBtn').addEventListener('click',forestSheet);
$('#soundBtn').addEventListener('click',()=>{pref.sound=!pref.sound;try{localStorage.setItem(LSP,JSON.stringify(pref))}catch(e){}render();if(pref.sound)plop()});
$('#status').addEventListener('click',e=>{if(e.target.id!=='pruneOne')return;const t=cur();const o=LAY&&LAY.branches[0];if(o){sel=o.b.id;render()}});
$('#sheet').addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const tr=e.target.closest('[data-tree]');if(tr){S.activeId=tr.dataset.tree;planting=false;sel=null;target=null;save();closeSheet();growQ.add('stem:'+S.activeId);render();return}
  const a=e.target.closest('[data-a]');if(!a)return;
  if(a.dataset.a==='close')closeSheet();
  if(a.dataset.a==='new')startPlant();
  if(a.dataset.a==='export'&&window.__files)window.__files.exp();
  if(a.dataset.a==='import'&&window.__files)$('#importFile').click();
});
$('#sheet').addEventListener('change',e=>{if(e.target.id==='importFile'&&window.__files)window.__files.imp(e.target)});
$('#undoBtn').addEventListener('click',undo);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#sheet').hidden)closeSheet();else if(sel||target||planting){sel=null;target=null;planting=false;armed=false;render()}}
  if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#inp').focus()}});
try{new ResizeObserver(()=>resize()).observe(stage)}catch(e){}
window.addEventListener('resize',()=>resize());
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>kick())}catch(e){}

/* 독립형에서 파일 저장·불러오기를 붙이는 자리 */
window.__app={get S(){return S},set S(v){S=migrate(v)},save,render,toast,emptyState,snap:()=>snap()};
resize();initCloud();
})();
</script>
</body></html>
